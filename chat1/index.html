<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FaceTime Web - Auto-Connect</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PeerJS Only -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Connection Screen -->
    <div id="connection-screen" class="screen glass-modal-container active">
        <div class="glass-modal">
            <div style="margin: 0 auto 24px; width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); overflow: hidden;">
                <img src="icon-192.png" alt="Logo" width="100%" height="100%" style="object-fit: cover; display: block;">
            </div>
            <h2>Secure Room</h2>
            
            <!-- Role Selection (Shown if no role saved) -->
            <div id="role-selection" class="id-section">
                <p class="section-label" style="text-align: center;">Select Your Identity</p>
                <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 16px;">
                    <button id="btn-role-a" class="primary-btn" style="background: rgba(255,255,255,0.15);">I am User A</button>
                    <button id="btn-role-b" class="primary-btn" style="background: rgba(255,255,255,0.15);">I am User B</button>
                </div>
            </div>

            <!-- Join Room (Shown once role is selected) -->
            <div id="join-section" class="id-section hidden" style="text-align: center;">
                <p class="section-label" style="text-align: center; margin-bottom: 16px;">You are <span id="current-role-display" style="color: var(--ios-green);">User A</span></p>
                <button id="btn-join-room" class="primary-btn">Join Secure Room</button>
                <button id="btn-change-role" style="margin-top: 16px; font-size: 13px; color: var(--text-muted); text-decoration: underline; background: none; border: none; cursor: pointer;">Change Role</button>
            </div>
        </div>
    </div>

    <!-- Video Call Interface -->
    <div id="call-screen" class="screen hidden video-first-layout">
        <!-- Remote Video -->
        <video id="remote-video" autoplay playsinline class="remote-video"></video>
        
        <!-- Call Header -->
        <div class="call-header">
            <span id="call-status">Waiting for partner...</span>
            <span id="call-duration" class="hidden">00:00</span>
        </div>

        <!-- Draggable PiP Self-View -->
        <div id="pip-container" class="pip-container">
            <video id="local-video" autoplay muted playsinline class="local-video"></video>
        </div>

        <!-- Floating Glass Control Dock -->
        <div class="control-dock">
            <button id="btn-voice-isolation" class="dock-btn" title="Voice Isolation">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 7.5S16 5 12 5s-5.5 2.5-5.5 2.5"/><path d="M20 12s-2.5-3.5-8-3.5S4 12 4 12"/><path d="M22 17s-3-4-10-4-10 4-10 4"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
            </button>
            <button id="btn-toggle-mic" class="dock-btn" title="Mute Audio">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            </button>
            <button id="btn-toggle-cam" class="dock-btn" title="Toggle Camera">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <button id="btn-end-call" class="dock-btn btn-danger" title="End Call">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/></svg>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast-notification" class="toast hidden"></div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
