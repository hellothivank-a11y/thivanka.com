<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FaceTime Web</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
    
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Onboarding Screen -->
    <div id="onboarding-screen" class="screen glass-modal-container active">
        <div class="glass-modal">
            <div style="margin: 0 auto 24px; width: 80px; height: 80px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); overflow: hidden;">
                <img src="icon-192.png" alt="Logo" width="100%" height="100%" style="object-fit: cover; display: block;">
            </div>
            <h2>Welcome</h2>
            <p>Enter a username to join the network.</p>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Your Username" autocomplete="off" spellcheck="false" />
            </div>
            <button id="login-btn" class="primary-btn">Continue</button>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen hidden">
        <header class="glass-header">
            <h1>Directory</h1>
            <div class="user-info">
                <div class="status-indicator online"></div>
                <span id="my-username-display"></span>
            </div>
        </header>
        
        <main class="users-list-container">
            <p class="subtitle">Online Users</p>
            <ul id="users-list" class="users-list">
                <!-- User items will be injected here via JS -->
            </ul>
        </main>
    </div>

    <!-- Video Call Interface -->
    <div id="call-screen" class="screen hidden video-first-layout">
        <!-- Remote Video -->
        <video id="remote-video" autoplay playsinline class="remote-video"></video>
        
        <!-- Call Header -->
        <div class="call-header">
            <span id="call-partner-name">Calling...</span>
            <span id="call-duration">00:00</span>
        </div>

        <!-- Draggable PiP Self-View -->
        <div id="pip-container" class="pip-container">
            <video id="local-video" autoplay muted playsinline class="local-video"></video>
        </div>

        <!-- Floating Glass Control Dock -->
        <div class="control-dock">
            <button id="btn-voice-isolation" class="dock-btn" title="Voice Isolation">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 7.5S16 5 12 5s-5.5 2.5-5.5 2.5"/><path d="M20 12s-2.5-3.5-8-3.5S4 12 4 12"/><path d="M22 17s-3-4-10-4-10 4-10 4"/><path d="M12 17v4"/><path d="M8 21h8"/></svg>
            </button>
            <button id="btn-toggle-mic" class="dock-btn" title="Mute Audio">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
            </button>
            <button id="btn-toggle-cam" class="dock-btn" title="Toggle Camera">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            </button>
            <button id="btn-toggle-chat" class="dock-btn" title="Chat">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button id="btn-end-call" class="dock-btn btn-danger" title="End Call">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/></svg>
            </button>
        </div>

        <!-- In-Call Chat Drawer -->
        <div id="chat-drawer" class="chat-drawer hidden">
            <div class="drawer-handle"></div>
            <div class="chat-header">
                <h3>Messages</h3>
                <button id="btn-close-chat" class="icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="chat-messages" class="chat-messages">
                <!-- Messages go here -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off"/>
                <button id="btn-send-msg" class="icon-btn send-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Incoming Call Overlay -->
    <div id="incoming-call-overlay" class="incoming-overlay hidden">
        <div class="incoming-card glass-modal">
            <div class="avatar-ring">
                <div class="avatar-pulse"></div>
                <div class="avatar-initial" id="incoming-caller-initial">?</div>
            </div>
            <h2 id="incoming-caller-name">Someone</h2>
            <p>is calling...</p>
            <div class="call-actions">
                <div class="action-group">
                    <button id="btn-decline-call" class="action-btn decline">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/></svg>
                    </button>
                    <span>Decline</span>
                </div>
                <div class="action-group">
                    <button id="btn-accept-call" class="action-btn accept">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    </button>
                    <span>Accept</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
