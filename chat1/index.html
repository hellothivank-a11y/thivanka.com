<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FaceTime – Oasis</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ─── Setup Screen ─── -->
    <div id="screen-setup" class="screen active">
        <div class="glass-card">
            <div class="app-logo">
                <img src="icon-192.png" alt="Logo">
            </div>
            <h1>Face Space</h1>
            <p class="subtitle">Private &amp; Secure</p>

            <!-- Role picker -->
            <div id="role-picker">
                <p class="label">Who are you?</p>
                <div class="role-btns">
                    <button id="btn-husband" class="role-btn blue">Husband</button>
                    <button id="btn-wife"    class="role-btn rose">Wife</button>
                </div>
            </div>

            <!-- Join button (shown after role picked) -->
            <div id="join-panel" class="hidden">
                <p class="label">Signed in as <strong id="role-label">—</strong></p>
                <button id="btn-join" class="cta-btn">Enter FaceTime</button>
                <button id="btn-switch" class="link-btn">Switch account</button>
            </div>
        </div>
    </div>

    <!-- ─── Call Screen ─── -->
    <div id="screen-call" class="screen hidden">

        <!-- Full-screen remote video -->
        <video id="remote-video" autoplay playsinline class="remote-video"></video>

        <!-- Top HUD -->
        <div class="call-hud">
            <span id="call-status-text">Waiting for partner…</span>
            <span id="call-timer" class="hidden">00:00</span>
        </div>

        <!-- Draggable PiP -->
        <div id="pip-wrap" class="pip-wrap">
            <video id="local-video" autoplay muted playsinline class="local-video"></video>
        </div>

        <!-- Control dock -->
        <div class="dock">
            <!-- Voice isolation -->
            <button id="btn-isolation" class="dock-btn" title="Voice Isolation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.5 7.5S16 5 12 5s-5.5 2.5-5.5 2.5"/>
                    <path d="M20 12s-2.5-3.5-8-3.5S4 12 4 12"/>
                    <path d="M22 17s-3-4-10-4-10 4-10 4"/>
                    <line x1="12" y1="17" x2="12" y2="23"/>
                </svg>
            </button>
            <!-- Mic -->
            <button id="btn-mic" class="dock-btn" title="Mute Mic">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                    <line x1="12" y1="19" x2="12" y2="23"/>
                    <line x1="8"  y1="23" x2="16" y2="23"/>
                </svg>
            </button>
            <!-- Camera -->
            <button id="btn-cam" class="dock-btn" title="Toggle Camera">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
            </button>
            <!-- End Call (red) -->
            <button id="btn-end" class="dock-btn end-btn" title="End Call">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js"></script>
</body>
</html>
