<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect — Honey & Bunny</title>
    <meta name="description" content="A private video call and chat app for Honey and Bunny.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ═══════════════════════════════════════════════════ -->
    <!-- LOGIN SCREEN -->
    <!-- ═══════════════════════════════════════════════════ -->
    <div id="login-screen" class="login-screen">
        <!-- Animated bg orbs -->
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
        <div class="bg-orb orb-3"></div>

        <div class="login-card" role="main">
            <div class="login-logo">
                <div class="logo-icon">❤️</div>
                <h1 class="login-title">Connect</h1>
                <p class="login-subtitle">Private space for two</p>
            </div>

            <!-- User selector -->
            <div class="user-selector" id="user-selector">
                <button class="user-btn active" id="btn-honey" onclick="selectUser('Honey')" aria-pressed="true">
                    <span class="user-avatar">🍯</span>
                    <span class="user-label">Honey</span>
                </button>
                <button class="user-btn" id="btn-bunny" onclick="selectUser('Bunny')" aria-pressed="false">
                    <span class="user-avatar">🐰</span>
                    <span class="user-label">Bunny</span>
                </button>
            </div>

            <!-- Passcode dots -->
            <div class="passcode-section">
                <p class="passcode-label">Enter passcode</p>
                <div class="passcode-dots" id="passcode-dots">
                    <span class="dot" id="dot-0"></span>
                    <span class="dot" id="dot-1"></span>
                    <span class="dot" id="dot-2"></span>
                    <span class="dot" id="dot-3"></span>
                </div>
                <div class="numpad" id="numpad">
                    <button class="num-btn" onclick="pressNum('1')">1</button>
                    <button class="num-btn" onclick="pressNum('2')">2</button>
                    <button class="num-btn" onclick="pressNum('3')">3</button>
                    <button class="num-btn" onclick="pressNum('4')">4</button>
                    <button class="num-btn" onclick="pressNum('5')">5</button>
                    <button class="num-btn" onclick="pressNum('6')">6</button>
                    <button class="num-btn" onclick="pressNum('7')">7</button>
                    <button class="num-btn" onclick="pressNum('8')">8</button>
                    <button class="num-btn" onclick="pressNum('9')">9</button>
                    <button class="num-btn" onclick="pressNum('0')">0</button>
                    <button class="num-btn del-btn" onclick="deleteNum()">⌫</button>
                </div>
                <p class="passcode-error hidden" id="passcode-error">Wrong passcode. Try again.</p>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════ -->
    <!-- MAIN APP SCREEN -->
    <!-- ═══════════════════════════════════════════════════ -->
    <div id="app-screen" class="app-screen hidden">

        <!-- ─── VIDEO AREA ─── -->
        <div class="video-area" id="video-area">

            <!-- Remote video (full-screen background) -->
            <video id="remote-video" autoplay playsinline class="remote-video"></video>

            <!-- Idle state (no call active) -->
            <div class="idle-state" id="idle-state">
                <div class="idle-avatar" id="idle-partner-avatar">🐰</div>
                <p class="idle-name" id="idle-partner-name">Bunny</p>
                <p class="idle-status" id="idle-status">
                    <span class="status-dot" id="status-dot"></span>
                    <span id="status-text">Offline</span>
                </p>
            </div>

            <!-- Local video (PiP tile) -->
            <div class="local-pip" id="local-pip">
                <video id="local-video" autoplay playsinline muted class="local-video"></video>
                <div class="pip-label" id="pip-label">You</div>
            </div>

            <!-- Top bar -->
            <div class="top-bar">
                <div class="top-bar-user">
                    <span class="top-avatar" id="top-avatar">🍯</span>
                    <span class="top-name" id="top-name">Honey</span>
                </div>
                <button class="chat-toggle-btn" id="chat-toggle-btn" onclick="toggleChat()" title="Toggle chat" aria-label="Toggle chat">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span class="chat-badge hidden" id="chat-badge">0</span>
                </button>
            </div>

            <!-- Bottom call controls (FaceTime-style pill) -->
            <div class="call-controls-pill" id="call-controls">
                <!-- IDLE: Start call buttons -->
                <div class="controls-idle" id="controls-idle">
                    <button class="ctrl-btn ctrl-video" id="btn-video-call" onclick="startCall('video')" title="Video Call" aria-label="Start video call">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.9L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
                        </svg>
                    </button>
                    <button class="ctrl-btn ctrl-audio" id="btn-audio-call" onclick="startCall('audio')" title="Voice Call" aria-label="Start voice call">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81a19.79 19.79 0 01-3.07-8.63A2 2 0 012 1h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 8.09a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
                        </svg>
                    </button>
                </div>

                <!-- IN-CALL: Control buttons -->
                <div class="controls-in-call hidden" id="controls-in-call">
                    <button class="ctrl-btn ctrl-mute" id="btn-mute" onclick="toggleMute()" title="Mute" aria-label="Toggle mute" aria-pressed="false">
                        <svg id="mic-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3zM19 10v2a7 7 0 01-14 0v-2H3v2a9 9 0 008 8.94V23h2v-2.06A9 9 0 0021 12v-2h-2z"/>
                        </svg>
                    </button>
                    <button class="ctrl-btn ctrl-end" id="btn-end" onclick="endCall()" title="End Call" aria-label="End call">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.12-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                        </svg>
                    </button>
                    <button class="ctrl-btn ctrl-camera" id="btn-camera" onclick="toggleCamera()" title="Camera" aria-label="Toggle camera" aria-pressed="false">
                        <svg id="camera-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.9L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Call timer -->
            <div class="call-timer hidden" id="call-timer">
                <span id="timer-text">0:00</span>
            </div>
        </div>

        <!-- ─── CHAT PANEL ─── -->
        <div class="chat-panel" id="chat-panel">
            <div class="chat-panel-header">
                <div class="chat-header-info">
                    <span class="chat-header-avatar" id="chat-header-avatar">🐰</span>
                    <div>
                        <p class="chat-header-name" id="chat-header-name">Bunny</p>
                        <p class="chat-header-status" id="chat-header-status">Private Chat</p>
                    </div>
                </div>
                <button class="chat-close-btn" onclick="toggleChat()" aria-label="Close chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="chat-messages" id="chat-messages" aria-live="polite" aria-label="Chat messages"></div>

            <div class="chat-input-area">
                <input type="text" id="msg-input" class="chat-input"
                    placeholder="Message…"
                    onkeypress="handleKeyPress(event)"
                    aria-label="Type a message" autocomplete="off">
                <button class="send-btn" onclick="sendMessage()" aria-label="Send message">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════ -->
    <!-- INCOMING CALL OVERLAY -->
    <!-- ═══════════════════════════════════════════════════ -->
    <div class="incoming-call-overlay hidden" id="incoming-call-overlay" role="alertdialog" aria-label="Incoming call">
        <div class="incoming-call-card">
            <!-- Pulse rings -->
            <div class="pulse-ring ring-1"></div>
            <div class="pulse-ring ring-2"></div>
            <div class="pulse-ring ring-3"></div>

            <div class="incoming-avatar" id="incoming-avatar">🍯</div>
            <p class="incoming-name" id="incoming-name">Honey</p>
            <p class="incoming-type" id="incoming-type">FaceTime Video</p>

            <div class="incoming-actions">
                <button class="incoming-btn decline-btn" onclick="declineCall()" aria-label="Decline call">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.12-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                    </svg>
                    <span>Decline</span>
                </button>
                <button class="incoming-btn accept-btn" onclick="acceptCall()" aria-label="Accept call">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.12-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
                    </svg>
                    <span>Accept</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════ -->
    <!-- NOTIFICATION TOAST -->
    <!-- ═══════════════════════════════════════════════════ -->
    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>

</html>
