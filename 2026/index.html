<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Call & Chat</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #121212; color: #e0e0e0; display: flex; flex-direction: column; min-height: 100vh; padding: 10px; }
        .setup-box { background: #1e1e1e; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 10px; }
        input { padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: white; margin: 5px; width: 80%; max-width: 250px; }
        button { padding: 10px 15px; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; margin: 5px; }
        .btn-host { background: #28a745; color: white; }
        .btn-join { background: #007bff; color: white; }
        .container { display: flex; flex: 1; gap: 10px; flex-wrap: wrap; }
        .video-section { flex: 2; min-width: 300px; display: flex; justify-content: center; align-items: center; background: #1e1e1e; border-radius: 10px; padding: 10px; }
        .video-grid { display: flex; width: 100%; gap: 10px; justify-content: center; flex-wrap: wrap; }
        video { width: 48%; max-width: 450px; border-radius: 8px; background: #000; object-fit: cover; aspect-ratio: 16/9; }
        .chat-section { flex: 1; min-width: 280px; background: #1e1e1e; border-radius: 10px; display: flex; flex-direction: column; padding: 10px; height: 350px; }
        .chat-box { flex: 1; overflow-y: auto; background: #121212; border-radius: 5px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 8px; max-width: 80%; word-break: break-word; font-size: 14px; }
        .me { background: #007bff; align-self: flex-end; color: white; }
        .them { background: #333; align-self: flex-start; color: white; }
        .chat-input { display: flex; margin-top: 10px; gap: 5px; }
        .chat-input input { flex: 1; width: auto; }
    </style>
</head>
<body>

    <div class="setup-box">
        <h3>🔒 Private Call & Chat</h3>
        <p style="font-size: 12px; color: #aaa; margin: 5px 0;">දෙන්නම එකම Room Name එක පාවිච්චි කරන්න.</p>
        <input type="text" id="room-id" placeholder="Secret Room Name (eg: love123)">
        <br>
        <button class="btn-host" onclick="startHost()">1. Start Room (Host)</button>
        <button class="btn-join" onclick="joinRoom()">2. Join Room</button>
    </div>

    <div class="container">
        <div class="video-section">
            <div class="video-grid">
                <video id="localVideo" autoplay muted playsinline></video>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>

        <div class="chat-section">
            <div class="chat-box" id="chatBox">
                <div class="message them">System: Room එක හදන කෙනා 'Start Room' එකත්, අනෙක් කෙනා 'Join Room' එකත් ක්ලික් කරන්න.</div>
            </div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button style="background:#28a745; color:white;" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        let peer = null;
        let conn = null;
        let localStream = null;

        // PeerJS Config with Google Free STUN Servers (Fixes NAT/Firewall blocking)
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        };

        // Camera Access
        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
            localStream = stream;
            document.getElementById('localVideo').srcObject = stream;
        }).catch(err => alert("Camera/Mic Permission ලබාදෙන්න!"));

        // 1. Host Starts Room
        function startHost() {
            const roomName = document.getElementById('room-id').value.trim();
            if (!roomName) return alert("Secret Room Name එකක් ගහන්න!");

            peer = new Peer(roomName, peerConfig);

            peer.on('open', id => {
                appendMessage("System", "Room Created! Waiting for partner to click Join...", "them");
            });

            peer.on('error', err => {
                if(err.type === 'unavailable-id') {
                    alert("මේ Room Name එක දැනටමත් Active. වෙනත් Name එකක් දාලා ට්‍රයි කරන්න.");
                } else {
                    alert("Error: " + err.type);
                }
            });

            peer.on('connection', connection => {
                conn = connection;
                setupChat();
            });

            peer.on('call', call => {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });
            });
        }

        // 2. Joiner Joins Room
        function joinRoom() {
            const roomName = document.getElementById('room-id').value.trim();
            if (!roomName) return alert("Secret Room Name එකක් ගහන්න!");

            peer = new Peer(peerConfig);

            peer.on('open', id => {
                appendMessage("System", "Connecting to Host...", "them");
                
                // Connect Chat
                conn = peer.connect(roomName);
                setupChat();

                // Connect Call
                const call = peer.call(roomName, localStream);
                call.on('stream', remoteStream => {
                    document.getElementById('remoteVideo').srcObject = remoteStream;
                });
            });
        }

        function setupChat() {
            if (!conn) return;
            conn.on('open', () => {
                appendMessage("System", "Connected! දැන් කතා කරන්න පුළුවන්.", "them");
            });
            conn.on('data', data => {
                appendMessage("Partner", data, "them");
            });
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg || !conn) return;

            conn.send(msg);
            appendMessage("Me", msg, "me");
            input.value = "";
        }

        function appendMessage(sender, text, type) {
            const box = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${type}`;
            msgDiv.innerText = text;
            box.appendChild(msgDiv);
            box.scrollTop = box.scrollHeight;
        }
    </script>
</body>
</html>
